[build]
  command = "npm install"
  publish = "customer"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  included_files = ["backend/src/**", "backend/schema.sql", "node_modules/sql.js/dist/sql-wasm.wasm"]

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
